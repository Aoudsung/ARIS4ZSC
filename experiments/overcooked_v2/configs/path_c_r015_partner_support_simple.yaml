    training_manifest_path: ../../../results/path_c_official_sp_simple/seed_102/official_artifact_manifest.json
  - candidate_id: official_rnn_op_other_play_v1_seed201_step29999104
    family_id: official_rnn_op_other_play_v1
    training_seed: 201
    expected_environment_steps: 29999104
    checkpoint_path: ../../../results/path_c_official_op_simple/seed_201/run_0/ckpt_final
    training_config_path: path_c_official_op_simple_seed201.yaml
