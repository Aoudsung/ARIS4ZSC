schema_version: path_c_r015_partner_support_v1
# R015 是机会审计实验编号；本文件只登记它所需的伙伴支持。
registration_status: configured
scientific_readout_allowed: false
device: cuda
evaluation_seed: 8115
environment_config: ocv2_test_time_simple_standard.yaml
output_dir: ../../../results/path_c_r015_partner_support_simple

# 伙伴族由训练算法、训练目标和约定生成机制的三元组定义；两族在约定生成机制上不同。
families:
  - family_id: official_rnn_sp_ippo_v1
    training_algorithm: official_recurrent_independent_proximal_policy_optimization
    training_objective: official_clipped_policy_and_value_objective_with_entropy
    reward_objective: raw_team_reward_plus_official_environment_shaping_linear_to_zero_by_15000000_steps
    convention_generation: official_rnn_sp_parameter_shared_self_play
    observation_contract: official_local_5x5
    action_space: six_primitive_actions
    model_class: OfficialFlaxRecurrentActor
    checkpoint_phase: completed_official_training_run
    action_rule: official_flax_categorical_actor_v1
  - family_id: official_rnn_op_other_play_v1
    training_algorithm: official_recurrent_independent_proximal_policy_optimization
    training_objective: official_clipped_policy_and_value_objective_with_entropy
    reward_objective: raw_team_reward_plus_official_environment_shaping_linear_to_zero_by_15000000_steps
    convention_generation: official_rnn_op_symmetry_randomized_other_play
    observation_contract: official_local_5x5
    action_space: six_primitive_actions
    model_class: OfficialFlaxRecurrentActor
    checkpoint_phase: completed_official_training_run
    action_rule: official_flax_categorical_actor_v1

# 固定支持只有四个 checkpoint：每族两个独立训练 run，每个 run 一个最终候选。
# 候选名和 expected_environment_steps 使用官方整数更新日程的实际值，不把名义 3000 万写成实测值。
candidates:
  - candidate_id: official_rnn_sp_ippo_v1_seed101_step29949952
    family_id: official_rnn_sp_ippo_v1
    training_seed: 101
    expected_environment_steps: 29949952
    checkpoint_path: ../../../results/path_c_official_sp_simple/seed_101/run_0/ckpt_final
    training_config_path: path_c_official_sp_simple_seed101.yaml
    training_manifest_path: ../../../results/path_c_official_sp_simple/seed_101/official_artifact_manifest.json
  - candidate_id: official_rnn_sp_ippo_v1_seed102_step29949952
    family_id: official_rnn_sp_ippo_v1
    training_seed: 102
