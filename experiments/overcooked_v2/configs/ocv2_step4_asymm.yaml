layout: asymm_advantages
env:
  max_steps: 400
  observation_type: default
  negative_rewards: true
  sample_recipe_on_delivery: true
  random_reset: false
  random_agent_positions: false
  force_path_planning: true
options:
  max_option_steps: 16
  strict_preconditions: true
  dynamic_budget: true
layouts:
  filter:
    min_options: 6
graph:
  ce_path: outputs/asymm_ce_egocredit_progression_seed/ce_refined.npy
  replay_path: outputs/asymm_ce_egocredit_progression_seed/replay.npz
  preflight_path: results/ocv2_asymm/preflight.json
  ce_eta: 0.05
  max_factors: 16
  full_max_factors: 16
  selection: coverage_constrained_ce
  required_option_kind_coverage:
    pick_plate:
      min_factors: 1
    plate_soup:
      min_factors: 1
    serve_soup:
      min_factors: 1
  required_option_id_coverage:
    serve_soup:
      min_per_valid_option: 1
  diversity:
    max_factors_per_option_kind_pair: 3
    max_factors_per_option_id: 4
  overcomplete_extra_factors: 8
  local_return_horizon_options: 3
  modes:
    bottleneck: 3
    resource: 2
    handoff: 3
    serving: 2
    pot_allocation: 2
    recipe_indicator: 2
    generic_option_pair: 3
diagnostics:
  proxy_episodes: 10
training:
  require_preflight_accepted: true
  total_updates: 5000
  updates_per_transition: 8
  batch_size: 8
  warmup_transitions: 8
  replay_size: 5000
  gamma: 0.99
  cost_coef: 0.02
  cost_per_step: 1.0
  shaped_reward_coef: 1.0
  sparse_credit: ego_delivery
  terminal_progress_shaping:
    enabled: true
    ego_plate_pick_bonus: 0.5
    ego_plate_soup_bonus: 1.5
    ego_serve_bonus: 0.0
    max_bonus_per_step: 1.5
  terminal_exploration:
    enabled: true
    bias_start: 0.9
    bias_end: 0.35
    anneal_updates: 2500
    preferred_kinds:
    - serve_soup
    - plate_soup
    - pick_plate
  terminal_replay_seed:
    enabled: false  # P5: main path must not seed replay by named terminal-policy partner
    partner: terminal-yield
    target_ego_serves: 64
    max_episodes: 100
    max_episode_options: 28
    store_all_chain: true
    seed_updates: 600
    seed_batch_size: 8
    priority_kinds:
    - serve_soup
    - plate_soup
    - pick_plate
    - deliver_ingredient_to_pot
    - fetch_ingredient
    - clear_interaction_cell
    - wait_at_bottleneck
  learning_rate: 0.0003
  td_loss: huber
  huber_delta: 1.0
  double_q: true
  advantage_norm: none
  value_bound:
    enabled: true
    vmax: 30.0
    base_bound: 15.0
    adv_bound: 15.0
    adv_unit: 1.0
    reward_scale: 1.0
  train_partners:
  - ingredient-near
  - ingredient-far
  - dish-server
  - server-left
  - terminal-yield
  partner_sampling:
    terminal-yield: 3.0
  checkpoint_every: 500
  select_best_by: greedy
  require_ego_delivery_selection: true
  checkpoint_eval_episodes: 5
  hidden_dim: 64
  obs_encoder: auto
  num_partners: 7
  evidence_window: 4
  target_update_interval: 50
  grad_clip_norm: 5.0
  epsilon_start: 0.5
  epsilon_end: 0.1
  max_episode_options: 20
  log_interval: 100
  oracle_role_conditioned_ablation: false
evidence:
  partner_option_inference:
    allow_heuristic: true
    temperature: 1.0
    source_policy: behavior_observable_only
