# Path C version-3 preregistration template.
# This template is deliberately inadmissible for a run. A claim-bearing copy must
# fill every null freeze slot, set status to frozen before execution, and bind all
# semantic hashes below. Locked-audit results may not change any frozen choice.

schema_version: path_c_preregistration_schema_v3
version: path_c_preregistration_v3_template
measurement_schema_version: path_c_measurement_v3
status: template_not_valid_for_runs
freeze_timestamp:

semantic_bindings:
  code_commit:
  resolved_config_sha256:
  module_registry_sha256:
  partner_registry_sha256:
  option_policy_sha256:
  evidence_spec_sha256:
  response_vocabulary_sha256:
  audit_battery_sha256:
  split_manifest_sha256:
  rng_key_schedule_version: path_c_rng_key_schedule_v1

semantic_sources:
  module_registry:
    path:
    sha256:
  partner_registry:
    path:
    sha256:
  option_policy:
    path:
    sha256:
  split_manifest:
    path:
    sha256:
  audit_battery:
    path:
    sha256:

evidence_spec:
  schema_version: ego_evidence_spec_v1
  enable: true
  observation_dim:
  num_primitive_actions:
  num_options:
  max_primitive_actions_per_decision: 64
  max_episode_decisions: 128
  progress_event_dim:
  observation_schema:
  primitive_action_names:
  option_names:
  progress_event_names:
  public_observation: current_raw_or_public_observation
  previous_decision_window_fields:
    - ego_primitive_actions
    - partner_primitive_actions
    - ego_option
    - option_duration
    - reward
    - progress_events
    - valid_action_mask
    - terminated
    - truncated
  forbidden_fields:
    - identity
    - mechanism
    - style
    - seed
    - layout_style_label
  shared_by:
    - probing_ego
    - full_history_rnn
    - rnn_residualized
    - exact_belief_filter
    - learned_hmm_filter
    - particle_belief_filter
  sequence_training: full_episode

ensemble:
  architecture: recurrent_sequence_v1
  n_heads: 5
  bootstrap_p: 0.8
  bootstrap_scope: episode
  prior_scale: 0.05
  prior_network: independent_frozen_recurrent
  recurrent_state: head_specific
  dueling_advantage_center: valid_actions_only
  disagreement_stat: variance
  disagreement_target: normalized_advantage
  tie_atol: 1.0e-6

probe:
  enable: true
  collection_enable: true
  locked_audit_adaptive_probe_enable: false
  rule: max_normalized_advantage_disagreement
  disagreement_threshold: 0.02
  return_floor: 0.0
  record_candidate_mask: true
  record_all_scores: true
  record_propensity: true
  record_budget_and_cost: true
  random_probe_support_matched: true
  direct_information_baseline: synthetic_oracle_diagnostic_only
  min_selected_probes: 100
  min_probe_opportunities: 1000
  min_context_coverage: 0.8
  min_action_coverage: 0.8

response_summary_spec:
  schema_version: path_c_response_summary_v1
  enable: true
  selection_role: design
  primary_kind: canonical_finite_token
  window_decisions: 5
  latency_bin_upper_bounds: [0, 1, 2, 4, 8, 16]
  response_classes:
    - no_response
    - commitment
    - help
    - wait
    - defer
    - escalate
    - block
    - progress
    - delivery_success
    - delivery_failure
  structured_multilabel_role: secondary_only
  q_source: frozen_vocabulary_length
  structured_multi_label_readout: secondary_only
  forbidden_fields:
    - identity
    - seed
    - style
    - layout_style
    - trajectory_source
    - absolute_target_coordinates

fingerprint:
  enable: true
  kind: counterbalanced_value_null_candidate
  vocab: [0, 1]
  positive_control_kind: raw_response_value_null
  negative_control_kind: metadata_only
  admission_required: true
  value_source: exact_oracle_or_strict_equivalence_confidence_interval
  mechanism_crossed: true

synthetic_factorial:
  true_value_class_source: registry_oracle
  value_mechanisms: 3
  independent_identity_style_realizations_per_mechanism: 5
  fingerprints_per_cell: 2
  near_complete_mechanism_fingerprint_cross: true
  overlap_posterior_registry: path_c_overlap_posterior
  admission_value_source: exact_oracle_or_strict_equivalence_confidence_interval

split:
  schema_version: path_c_split_manifest_v3
  enable: true
  manifest_sha256:
  roles: [train, design, calibration, locked_audit]
  deterministic: true
  mechanism_balanced: true
  group_disjoint_fields:
    - surface_identity_key
    - style_id
    - seed_group
    - layout_template
  minimum_groups_per_mechanism: 4
  preferred_groups_per_mechanism: 5
  primary_shift: identity
  secondary_shift: layout
  role_internal_value_cross_fitting: true
  fail_closed_on_infeasible_role: true

budget:
  effective_episode_floor: 2000
  effective_transition_floor: 40000
  training_environment_steps:
  training_gradient_updates:
  evaluation_environment_step_limit:
  evaluation_schedule_id:
  probe_budget_grid_sha256:
  action_support_sha256:
  maximum_audit_primitive_steps:
  split_unit: episode_uid
  matched_environment_steps: true
  matched_gradient_updates: true
  matched_evaluation_schedule: true
  matched_action_support: true
  matched_probe_cost: true
  report_training_flops: true
  report_wall_clock: true
  report_inference_latency: true
  required_policy_keys:
    - probing_ego
    - random_probe
    - no_probe
    - direct_information
    - full_history_rnn
    - rnn_residualized
    - exact_belief_filter
    - learned_hmm_filter
    - particle_belief_filter

baselines:
  acting_protocol_version: path_c_acting_policy_v1
  deployable_required:
    - full_history_rnn
    - rnn_residualized
    - exact_belief_filter
    - learned_hmm_filter
    - particle_belief_filter
    - random_probe
    - no_probe
  design_only_diagnostic:
    - direct_information
    - oracle_probe_design
  oracle_only:
    - identity_embedding
  strongest_baseline_candidates:
    - full_history_rnn
    - rnn_residualized
    - exact_belief_filter
    - learned_hmm_filter
    - particle_belief_filter
  selection_role: design
  selection_rule: highest_mean_normalized_net_return_auc_then_preregistered_order
  locked_selection_artifact_sha256:

primary_endpoint:
  schema_version: path_c_primary_endpoint_v1
  enable: true
  name: cross_identity_normalized_net_return_probe_budget_auc_difference
  probe_budget_grid: [0, 1, 2, 4, 8]
  normalization_rule: affine_without_clipping
  normalization_lower:
  normalization_upper:
  probe_cost_per_use:
  preregistered_margin:
  confidence_level: 0.95
  bootstrap_iterations: 10000
  cluster_unit: identity_group
  shift: identity_only
  layout_shift_endpoint: secondary
  selected_baseline_source: frozen_design_selection_artifact

secondary_endpoints:
  representation_scope: normalized_advantage_decision_code
  public_base_residual: secondary_visualization_only
  response_prediction: secondary
  ecological_value_class_source: frozen_cross_fitted_value_bins
  mechanism_label_role: secondary_proxy_only
  cluster_permutation: episode_within_registered_strata
  leakage_channels:
    - fingerprint
    - identity
    - seed
    - layout_style
    - surface_action_frequency
    - trajectory_source
  thresholds:
    response_advantage: 0.0
    value_advantage: 0.0
    transfer_advantage: 0.0
    conditional_leakage_max: 0.01
    null_equivalence_gain: 0.05
    synthetic_power_min_advantage: 0.05
    value_ablation_min_degradation: 0.01
    nuisance_value_gain_equivalence: 0.01
    kernel_confidence: 0.95
    kernel_min_outer_replicas: 50

power_analysis:
  positive_and_null_cluster_simulation_required: true
  joint_operating_characteristics_required: true
  equivalence_test: two_one_sided_tests
  primary_alpha: 0.05
  secondary_multiplicity: hierarchical_gatekeeping
  selection_role: design
  cluster_unit: identity_group
  clusters_per_trial:
  simulation_repetitions:
  bootstrap_iterations:
  seed:
  equivalence_margin:
  minimum_positive_power:
  minimum_null_equivalence_power:
  minimum_joint_power:

belief_kernel_audit:
  schema_version: path_c_belief_kernel_audit_v1
  enable: true
  exact_mode: true
  tier1_hypothesis_prune: 0.0
  posterior_bias_bound: 0.0
  reset_bias_bound: 0.0
  rng_key_schedule_version: path_c_rng_key_schedule_v1
  estimand: belief_averaged_intervention_kernel
  naive_single_checkpoint_fork_admissible: false
  audit_unit: registered_audit_information_state
  inference_cluster_unit: outer_replica
  tv_convention: half_l1
  recovery_condition: "beta - alpha > 4 * (sampling_radius + posterior_bias_bound + reset_bias_bound)"
  outer_replicas_M:
  simultaneous_cell_count:
  confidence_delta:
  inner_forks_L_inner:
  probe_horizon_T_probe:
  audit_information_states:
  instrument_cell_registry_sha256:
  response_vocabulary_source: ResponseSummarySpecV1.vocabulary
  primary_kernel_table_granularity: one_row_per_outer_replica_with_paired_probes
  posterior_full_state_sampler:
    draw: "U=(theta,execution_state) from P(U|history) independently per outer replica"
    paired_frozen_probes: true
    rao_blackwell_mixture: secondary_only
  tier1_exact_enumeration_replay:
    enable: true
    partner_registry_frozen_required: true
    prior_over_theta:
      schema_version: path_c_theta_prior_v1
      partner_registry_sha256:
      support:
    likelihood: sparse_forward_algorithm_over_discrete_execution_chain
    generation_inference_policy_function: option_distribution
    execution_state_resample: full_filtered_conditional_per_outer_replica
    tier1_hypothesis_prune: 0.0
    rho_prune: 0.0
    posterior_bias_bound: 0.0
    reset_bias_bound: 0.0
    brute_force_differential_fixture_required: true
  tier1_approximate_mode:
    enable: false
    report_discarded_posterior_mass_as_rho_prune: true
    bound_required: true
  tier2_hash_and_match:
    enable: true
    group_key: exact_ego_observable_history_bytes
    hash: sha256_with_post_hash_byte_verification
    maximum_outer_draws_per_episode_and_key: 1
    recurrence_and_positivity_required: true
    support_bias_registration_required: true
    claim_scope: registered_high_recurrence_audit_units_only
  rng:
    schedule_version: path_c_rng_key_schedule_v1
    replay_uses_original_keys: true
    fork_uses_fresh_derived_keys: true
    named_streams: [jax, numpy, python, torch]
  validity_measurement_schema:
    required_fields:
      - alpha_upper
      - beta_lower
      - sampling_radius
      - rho_prune
      - posterior_bias_bound
      - reset_bias_bound
      - exact_or_approximate
    instrument_valid_rule: beta_lower > alpha_upper
  validity_checks:
    - software_conformance
    - posterior_replicas_match_exact_posterior_on_synthetic
    - reconstituted_state_preserves_registered_observable_information
    - outer_replica_effective_sample_size_and_independence
    - confidence_intervals_clustered_by_outer_replica
    - point_mass_oracle_control_equivalence
    - overlapping_posterior_expected_naive_discrepancy_and_corrected_recovery
    - tier1_tier2_equivalence_on_shared_audit_units
    - true_theta_replay_reproduces_diagnostic_state_fields
    - tie_and_noop_reroute_likelihood_differential_tests
    - no_primary_support_violations

audit_battery:
  schema_version: path_c_audit_battery_v1
  enable: true
  method_agnostic_core_required: true
  design_only_extension_frozen_before_locked_audit: true
  invalid_option_fallback_is_part_of_intervention: true
  cost_unit: primitive_environment_step
  core_probe_count:
  battery_sha256:

artifact_contract:
  schema_version: path_c_artifacts_v3
  enable: true
  storage: content_addressed_append_only_shards
  training_snapshots_default: false
  audit_harvest_separate: true
  required_hashes:
    - code_commit
    - preregistration_sha256
    - resolved_config_sha256
    - module_registry_sha256
    - partner_registry_sha256
    - option_policy_sha256
    - evidence_spec_sha256
    - response_vocabulary_sha256
    - audit_battery_sha256
    - split_manifest_sha256
    - rng_key_schedule_version

decision:
  schema_version: path_c_decision_v3
  order:
    - software_conformance
    - instrument_validity
    - design_and_calibration_freeze
    - locked_primary_efficacy
    - secondary_mechanisms
  instrument_valid: beta_lower > alpha_upper
  primary_effective: primary_auc_difference_lower_bound > preregistered_margin
  missing_primary_result: primary_not_run
  validity_failure_claim: diagnostic_only
  type_b_review_required: true
