  primary_kernel_table_granularity: one_row_per_outer_replica_with_paired_probes
  posterior_full_state_sampler:
    draw: "U=(theta,execution_state) from P(U|history) independently per outer replica"
    paired_frozen_probes: true
    rao_blackwell_mixture: secondary_only
  tier1_exact_enumeration_replay:
    enable: true
    partner_registry_frozen_required: true
    prior_over_theta:
      schema_version: path_c_theta_prior_v1
      partner_registry_sha256:
      support:
    likelihood: sparse_forward_algorithm_over_discrete_execution_chain
    generation_inference_policy_function: option_distribution
    execution_state_resample: full_filtered_conditional_per_outer_replica
    tier1_hypothesis_prune: 0.0
    rho_prune: 0.0
    posterior_bias_bound: 0.0
    reset_bias_bound: 0.0
    brute_force_differential_fixture_required: true
  tier1_approximate_mode:
    enable: false
    report_discarded_posterior_mass_as_rho_prune: true
    bound_required: true
  tier2_hash_and_match:
    enable: true
    group_key: exact_ego_observable_history_bytes
    hash: sha256_with_post_hash_byte_verification
    maximum_outer_draws_per_episode_and_key: 1
    recurrence_and_positivity_required: true
    support_bias_registration_required: true
    claim_scope: registered_high_recurrence_audit_units_only
  rng:
    schedule_version: path_c_rng_key_schedule_v1
    replay_uses_original_keys: true
    fork_uses_fresh_derived_keys: true
    named_streams: [jax, numpy, python, torch]
  validity_measurement_schema:
    required_fields:
      - alpha_upper
      - beta_lower
      - sampling_radius
      - rho_prune
      - posterior_bias_bound
      - reset_bias_bound
      - exact_or_approximate
    instrument_valid_rule: beta_lower > alpha_upper
  validity_checks:
