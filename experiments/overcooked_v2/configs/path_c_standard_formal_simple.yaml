schema_version: path_c_standard_training_v1
run_kind: formal
# 历史优势分歧实现只保留作消融，不再承担优化后 proposal 的正式主结果。
scientific_readout_allowed: false
method_variant: historical_advantage_disagreement
# 冻结基准 seed。R020 授权时按本文件冲压 10 份逐 seed 副本（101–110），
# 只允许改 seed 与 output_dir 两个字段；其余任何字段变更都要求重新冻结。
seed: 101
device: cuda
environment_config: ocv2_test_time_simple_standard.yaml
output_dir: ../../../results/path_c_standard_formal_simple_amendment2/seed_101
model:
  # test_time_simple 的官方局部观测是 5x5x39（远端 R010 实测回读）。
  observation_shape: [5, 5, 39]
  n_heads: 5
  visual_embedding_dim: 128
  encoder_dim: 128
  recurrent_dim: 128
  conv_channels: [32, 32, 16]
  encoder_spatial_mode: flatten
  prior_scale: 0.1
  prior_seed: 31
# 分歧统计非负，阈值必须严格为正；0.02 与既有预注册约定一致，
# R040 消融负责阈值敏感性检查。
probe:
  enabled: true
  disagreement_threshold: 0.02
  # 以下三个数字槽须在下一次运行授权前冻结。
  max_probe_regret: 1.0
  probe_budget_per_episode: 20
  probe_window_environment_steps: 100
  disagreement_stat: variance
training:
  # 训练目标使用原始团队回报加环境原生的每位置塑形回报；塑形系数在每阶段
  # 前半段从 1 线性降到 0。循环网络的上一时刻回报输入和评估仍只用原始回报。
  # 每 seed 总预算与官方单 run 3e7 环境步对齐；两阶段都计入总预算，
  # 因此本方法的每 seed 总步数不超过官方口径。
  total_environment_steps: 30000000
  # 阶段一（自博弈伙伴池）1000 万步，四个等距快照构成技能多样的池；
  # 阶段二（Path C 主策略对池训练）2000 万步，交付策略拿走三分之二预算。
  self_play_environment_steps: 10000000
  path_c_environment_steps: 20000000
  # 250 整除全部阶段与快照边界（256 不整除 3e7）。
  batch_size_envs: 250
  partner_pool_snapshot_steps: [2500000, 5000000, 7500000, 10000000]
  # 主策略从零初始化：从自博弈终点热启动会先锁死单一约定，
  # 与 Fictitious Co-Play 的池上从零训练同类，利于跨博弈稳健性。
  ego_initialization: fresh
  replay_capacity_episodes: 1024
  minibatch_episodes: 8
  learning_starts_episodes: 128
  updates_per_vector_step: 1
  target_update_environment_steps: 100000
  # 100k steps = 250 complete 400-step episodes, producing 300 rows over 30M.
  metrics_interval_environment_steps: 100000
  # Path C 阶段到 500 万步仍没有正的原始交付回报时停止，避免继续消耗预算。
  stop_if_no_path_c_delivery_by_environment_steps: 5000000
  gamma: 0.99
  learning_rate: 0.00025
  gradient_clip_norm: 10.0
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_environment_steps: 5000000
  bootstrap_p: 0.5
