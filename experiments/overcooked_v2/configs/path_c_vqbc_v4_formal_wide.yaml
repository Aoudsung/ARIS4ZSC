schema_version: path_c_model_v4_1
run_kind: formal
scientific_readout_allowed: false

environment:
  layout: test_time_wide
  agent_view_size: 2
  indicate_successful_delivery: true
  episode_steps: 400
  num_envs: 250

partner_sampling:
  schedule: uniform_member_episode_v1
  include_frozen_current_policy: true

model:
  hidden_dim: 128
  head_hidden_dim: 128
  action_embedding_dim: 16
  slot_count: 8
  response_count: 16
  action_count: 6
  prior_scale: 0.01
  log_standard_deviation_minimum: -5.0
  log_standard_deviation_maximum: 2.0

training:
  environment_steps: 11000000
  unroll_length: 400
  update_epochs: 4
  minibatches_per_epoch: 50
  bellman_learning_rate: 0.0001
  outcome_learning_rate: 0.00025
  gradient_clip_norm: 0.25
  gamma: 0.99
  responsibility_temperature: 1.0
  bootstrap_probability: 0.8
  polyak_coefficient: 0.005
  codebook_decay: 0.99
  code_replacement_rollouts: 10
  metrics_interval_environment_steps: 100000
  checkpoint_interval_environment_steps: 100000

kl_control:
  target_per_step: 0.02
  initial_temperature: 1.0
  dual_learning_rate: 0.001
  minimum_temperature: 0.05
  maximum_temperature: 20.0

evaluation:
  deployment_modes:
    - posterior_use
    - prior_only
    - reference_only
    - generic_response_information
  episodes_per_pairing: 500

output_root: ../../../results/path_c_vqbc_v4/test_time_wide/formal
