version: 11

environment:
  layout: test_time_wide
  agent_view_size: 2
  indicate_successful_delivery: true
  negative_rewards: true
  random_agent_positions: true
  sample_recipe_on_delivery: true
  episode_steps: 400

model:
  task_hidden_dim: 128
  capability_hidden_dim: 64
  protocol_hidden_dim: 128
  capability_dim: 16
  protocol_components: 4
  component_embedding_dim: 16
  actor_hidden_dim: 128
  critic_hidden_dim: 128
  response_hidden_dim: 128
  modulation_rank: 8
  action_embedding_dim: 16

ppo:
  update_epochs: 4
  learning_rate: 0.00025
  gradient_clip_norm: 0.25
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_clip_epsilon: 0.2
  entropy_weight: 0.01
  value_weight: 0.5
  normalize_advantages: true
  polyak_coefficient: 0.005
  lr_warmup_fraction: 0.05
  anneal_learning_rate: true
  adam_epsilon: 0.00001

# deprecated: retained for exactly one release cycle (METHOD_SPEC §3).
loss:
  response_weight: 1.0
  raw_q_weight: 1.0
  counterfactual_weight: 1.0
  decision_equivalence_weight: 0.1
  q_policy_weight: 0.25
  q_policy_temperature: 1.0
  q_policy_gap_midpoint: 1.0
  q_policy_gap_temperature: 1.0
  q_policy_disagreement_temperature: 5.0
  information_bottleneck_weight: 0.001
  information_bottleneck_free_bits_per_dimension: 0.1
  robust_generalist_weight: 0.1
  policy_belief_gradient_scale: 0.1
  belief_gradient_ema_decay: 0.99
  decision_regret_weight_maximum: 0.1
  decision_regret_schedule_midpoint: 0.2
  decision_regret_schedule_temperature: 0.05
  response_updates_per_outer_update: 2
  raw_q_updates_per_outer_update: 4

loss_v2:
  signature_weight: 1.0
  response_weight: 1.0
  separation_weight: 0.1
  combined_policy_kl_threshold: 0.04
  rank_hinge_margin: 0.1
  rank_hinge_advantage_gap: 2.0
  separation_margin_scale: 0.25

anchors:
  enabled: true
  interval_updates: 16
  ordinary_states: 32
  matched_code_pairs: 16
  fit_replicas: 4
  continuation_horizon: 128
  probe_steps: 16
  replay_capacity: 512
  replay_minibatch_size: 64
  policy_kl_decay: 0.05
  age_decay_updates: 64.0
  minimum_replay_weight: 0.001
  return_lower_bound: -400.0
  return_upper_bound: 400.0
  # §5.3 frozen comparator thresholds and the §6 extended M1 gate.
  observable_equivalent_accuracy_max: 0.55
  decision_distinct_accuracy_min: 0.70
  signature_distance_threshold: 1.0
  m1_spearman_threshold: 0.8
  m1_minimum_anchor_fraction: 0.9

partner_generator:
  enabled: false
  code_dim: 3
  hidden_dim: 128
  modulation_rank: 8
  episodes_per_update: 32
  episode_steps: 400
  update_epochs: 4
  environment_minibatches: 8
  cvar_level: 0.20
  target_polyak_coefficient: 0.005
  maximum_generator_probability: 0.75
  mixture_ramp_fraction: 0.30
  competence_temperature: 20.0
  cvar_ema_decay: 0.95
  imitation_initial_weight: 1.0
  brdiv_maximum_weight: 1.0
  smoothness_weight: 0.05
  lagrangian_learning_rate: 0.01
  competence_multiplier_maximum: 10.0
  kernel_bandwidth: 20.0
  kernel_jitter: 0.0001
  codes_per_update: 32
  # §7.2 shared-state diversity bank, code archive and backbone freeze.
  diversity_bank_size: 64
  diversity_codes_per_update: 8
  code_archive_capacity: 256
  freeze_after_imitation: true

# §7.3 static wide partner pool: default B0–B2 partner distribution.
partner_pool:
  enabled: true
  checkpoint_stages: [0.0, 0.5, 1.0]
  heuristic_family_test_only: true
  family_uniform_sampling: true

calibration:
  enabled: false
  alpha: 0.05
  support_quantile: 0.05
  minimum_run_count: 19
  block_unit: partner_run
  episodes_per_run: 128
  anchors_per_run: 64

training:
  rollout_length: 256
  context_dropout_initial: 0.30
  context_dropout_final: 0.10
  owner_sources_per_seed: 1
  generator_init_sources_per_mechanism: 1
  development_runs_per_mechanism: 4
  calibration_runs_per_mechanism: 5

evaluation:
  episodes_per_pairing: 500
  bootstrap_replicates: 9999
  evaluation_seed: 0
  report_br_prox: true
  br_prox_anchors_per_pairing: 8
  br_prox_fit_replicas: 8
  br_prox_evaluation_replicas: 16
  br_prox_continuation_horizon: 400
  evaluate_both_roles: true
  one_sided_alpha: 0.05
  minimum_ego_runs: 10
  minimum_partner_runs_per_mechanism: 4
  minimum_mechanisms: 4

upstream:
  total_timesteps: 30000000
  reward_shaping_horizon: 15000000
  checkpoint_progress: [0.0, 0.5, 1.0]

official_protocol:
  protocol_version: overcooked_v2_iclr2025_5ce1707_v1
  source_commit: 5ce1707cf31c1c115e6f6ba96db7bc9cc80a850e
  training_root_seed: 42
  training_run_count: 10
  evaluation_root_seed: 0
  evaluation_episodes_per_pairing: 500
