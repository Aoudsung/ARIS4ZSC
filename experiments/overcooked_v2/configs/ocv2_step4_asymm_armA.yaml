# RC re-verify ARM A — under-training/exploration hypothesis.
# = ocv2_step4_asymm.yaml (verified ego-credit fix) with: longer budget (5000 updates)
#   + more exploration (epsilon_start 0.5, epsilon_end 0.10). Reward scale UNCHANGED, so it
#   REQUIRES regenerated terminal-yield ego-credit CE graph (outputs/asymm_ce_egocredit_progression_seed) — regen CE under the terminal-yield train distribution.
# Tests: does the ego learn to plate/serve once given enough updates + exploration?
layout: asymm_advantages

env:
  max_steps: 400
  observation_type: default
  negative_rewards: true
  sample_recipe_on_delivery: true
  random_reset: false
  random_agent_positions: false
  force_path_planning: true

options:
  max_option_steps: 16
  strict_preconditions: true
  dynamic_budget: true

layouts:
  filter:
    min_options: 6

graph:
  # Regenerate CE for the terminal-yield train distribution before training.
  ce_path: outputs/asymm_ce_egocredit_progression_seed/ce_refined.npy
  replay_path: outputs/asymm_ce_egocredit_progression_seed/replay.npz
  preflight_path: results/ocv2_asymm/preflight.json
  ce_eta: 0.05
  max_factors: 16
  full_max_factors: 16
  selection: coverage_constrained_ce
  required_option_kind_coverage:
    pick_plate: {min_factors: 1}
    plate_soup: {min_factors: 1}
    serve_soup: {min_factors: 1}
  required_option_id_coverage:
    serve_soup: {min_per_valid_option: 1}
  diversity:
    max_factors_per_option_kind_pair: 3
    max_factors_per_option_id: 4
  overcomplete_extra_factors: 8
  local_return_horizon_options: 3
  modes:
    bottleneck: 3
    resource: 2
    handoff: 3
    serving: 2
    pot_allocation: 2
    recipe_indicator: 2
    generic_option_pair: 3

diagnostics:
  proxy_episodes: 10

training:
  require_preflight_accepted: true
  total_updates: 5000          # ARM A: 1000 -> 5000 (under-training hypothesis)
  updates_per_transition: 8
  batch_size: 8
  warmup_transitions: 8
  replay_size: 5000
  gamma: 0.99
  cost_coef: 0.02
  cost_per_step: 1.0
  shaped_reward_coef: 1.0      # unchanged vs base -> CE graph reusable
  sparse_credit: ego_delivery
  # Higher-risk terminal-stage intervention: actor-local progression shaping.
  # This is not team reward and does not pay the ego for partner plate/serve.
  # The bonus is small relative to the +20 ego delivery sparse reward; it exists
  # to make pick_plate -> plate_soup value propagation learnable before the sparse
  # serve transition is frequently sampled. Regenerate CE whenever this block changes.
  terminal_progress_shaping:
    enabled: true
    ego_plate_pick_bonus: 0.5
    ego_plate_soup_bonus: 1.5
    ego_serve_bonus: 0.0
    max_bonus_per_step: 1.5
  # Training-only directed epsilon exploration. Greedy/deployment action selection
  # remains argmax-Q over valid options; this only biases random exploration toward
  # terminal options once they are valid.
  terminal_exploration:
    enabled: true
    bias_start: 0.90
    bias_end: 0.35
    anneal_updates: 2500
    preferred_kinds:
      - serve_soup
      - plate_soup
      - pick_plate
  # Bellman replay seeding from scripted ego-owned terminal chains. This modifies
  # the replay distribution, not the loss: seeded rows are ordinary OptionTransition
  # samples trained with the same TD objective as online experience.
  terminal_replay_seed:
    enabled: true
    partner: terminal-yield
    target_ego_serves: 64
    max_episodes: 100
    max_episode_options: 28
    store_all_chain: true
    seed_updates: 600
    seed_batch_size: 8
    priority_kinds:
      - serve_soup
      - plate_soup
      - pick_plate
      - deliver_ingredient_to_pot
      - fetch_ingredient
      - clear_interaction_cell
      - wait_at_bottleneck
  learning_rate: 0.0003
  td_loss: huber
  huber_delta: 1.0
  double_q: true
  advantage_norm: none
  value_bound:
    enabled: true
    vmax: 30.0
    base_bound: 15.0
    adv_bound: 15.0
    adv_unit: 1.0
    reward_scale: 1.0
  train_partners:
    - ingredient-near
    - ingredient-far
    - dish-server
    - server-left
    - terminal-yield
  # Forward fix after reward-credit: increase train-only exposure where ego must own
  # plate/serve. This changes data distribution only; the controller remains argmax-Q
  # and training remains a single TD loss.
  partner_sampling:
    terminal-yield: 3.0
  checkpoint_every: 500
  select_best_by: greedy
  require_ego_delivery_selection: true
  checkpoint_eval_episodes: 5
  hidden_dim: 64
  obs_encoder: auto
  num_partners: 7
  evidence_window: 4
  target_update_interval: 50
  grad_clip_norm: 5.0
  epsilon_start: 0.5           # ARM A: 0.35 -> 0.5 (more early exploration)
  epsilon_end: 0.10            # ARM A: 0.05 -> 0.10 (sustained late exploration)
  max_episode_options: 20
  log_interval: 100
