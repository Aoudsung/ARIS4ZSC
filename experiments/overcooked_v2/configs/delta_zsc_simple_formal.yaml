version: 7

environment:
  layout: test_time_simple
  agent_view_size: 2
  indicate_successful_delivery: true
  negative_rewards: true
  random_agent_positions: true
  sample_recipe_on_delivery: true
  episode_steps: 400

model:
  task_hidden_dim: 128
  belief_hidden_dim: 128
  latent_dim: 8
  mixture_components: 4
  posterior_particles: 16
  belief_embedding_dim: 128
  actor_hidden_dim: 128
  critic_hidden_dim: 128
  response_hidden_dim: 128
  modulation_rank: 8
  action_embedding_dim: 16
  log_variance_minimum: -5.0
  log_variance_maximum: 2.0

ppo:
  update_epochs: 4
  learning_rate: 0.00025
  gradient_clip_norm: 0.25
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_clip_epsilon: 0.2
  entropy_weight: 0.01
  value_weight: 0.5
  max_approx_kl: 0.03
  normalize_advantages: true
  polyak_coefficient: 0.005
  lr_warmup_fraction: 0.05
  anneal_learning_rate: true
  adam_epsilon: 0.00001

loss:
  response_weight: 1.0
  raw_q_weight: 1.0
  q_policy_weight: 0.25
  q_policy_temperature: 1.0
  information_bottleneck_weight: 0.001
  information_bottleneck_free_bits: 1.0
  decision_regret_weight_maximum: 0.1
  conditional_entropy_weight: 0.01
  conditional_kl_weight: 1.0
  residual_norm_weight: 1.0
  response_updates_per_outer_update: 2
  raw_q_updates_per_outer_update: 4

anchors:
  interval_updates: 16
  pilot_ordinary_candidates: 128
  pilot_matched_code_candidates: 64
  pilot_replicas: 2
  selected_ordinary: 24
  selected_matched_code: 24
  fit_replicas: 8
  continuation_horizon: 128
  probe_steps: 16
  replay_capacity_per_epoch: 512
  audit_milestones: [C0, 15M, 22.5M, final]
  audit_ordinary_states: 32
  audit_matched_code_states: 32
  audit_fit_replicas: 32
  audit_evaluation_replicas: 64
  audit_continuation_horizon: 400
  audit_uniform_fraction: 0.25
  return_lower_bound: -400.0
  return_upper_bound: 400.0

partner_generator:
  code_dim: 8
  hidden_dim: 128
  modulation_rank: 8
  initial_current_probability: 0.0
  initial_snapshot_probability: 0.0
  initial_frozen_external_probability: 1.0
  episodes_per_update: 32
  episode_steps: 400
  update_epochs: 4
  environment_minibatches: 8
  snapshot_interval: 32
  cvar_level: 0.20
  source_distillation_kl_maximum: 0.05
  trust_region_kl_maximum: 0.03
  interpolation_uniform_kl_minimum: 0.01
  delivery_noninferiority_margin: 20.0
  brdiv_weight: 1.0
  smoothness_weight: 0.05
  lagrangian_learning_rate: 0.01
  kernel_bandwidth: 20.0
  kernel_jitter: 0.0001
  codes_per_update: 32

calibration:
  alpha: 0.05
  support_quantile: 0.05
  minimum_run_count: 19
  block_unit: partner_run
  enable_hard_gate_at_evaluation: true
  episodes_per_run: 128
  anchors_per_run: 64
  always_on_ablation: false

training:
  rollout_length: 256
  base_policy_lane_probability: 0.25
  conditional_policy_lane_probability: 0.75
  target_policy_epoch_updates: 16
  base_qualification_deadline_steps: 15000000
  owner_sources_per_seed: 1
  generator_init_sources_per_mechanism: 1
  development_runs_per_mechanism: 4
  calibration_runs_per_mechanism: 5

evaluation:
  episodes_per_pairing: 500
  bootstrap_replicates: 9999
  evaluation_seed: 0
  enable_adaptation: true
  report_br_prox: true
  br_prox_anchors_per_pairing: 8
  br_prox_fit_replicas: 8
  br_prox_evaluation_replicas: 16
  br_prox_continuation_horizon: 400
  evaluate_both_roles: true
  one_sided_alpha: 0.05
  minimum_ego_runs: 10
  minimum_partner_runs_per_mechanism: 4
  minimum_mechanisms: 4

upstream:
  total_timesteps: 30000000
  reward_shaping_horizon: 15000000
  checkpoint_progress: [0.0, 0.5, 1.0]

official_protocol:
  protocol_version: overcooked_v2_iclr2025_5ce1707_v1
  source_commit: 5ce1707cf31c1c115e6f6ba96db7bc9cc80a850e
  training_root_seed: 42
  training_run_count: 10
  evaluation_root_seed: 0
  evaluation_episodes_per_pairing: 500
