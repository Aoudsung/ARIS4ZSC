schema_version: path_c_model_v3
run_kind: formal
scientific_readout_allowed: false
condition_id: random_safe_probe
controller: registered_random_safe_probe_v1
environment: {layout: test_time_wide, agent_view_size: 2, indicate_successful_delivery: true, episode_steps: 400, num_envs: 250}
partner_pool:
  schema_version: path_c_family_pool_v1
  family_ids: [adapted_ego_family, own_backbone_history_family, foreign_self_play_history_family, other_play_history_family]
  family_weights: [0.25, 0.25, 0.25, 0.25]
  schedule: balanced_condition_independent_episode_v1
  member_sampling: uniform_within_family_v1
  current_policy_snapshot: freeze_complete_policy_at_rollout_start_v1
model: {encoder_dim: null, gru_hidden_dim: null, response_hidden_dim: 128, value_hidden_dim: 128, transition_hidden_dim: 128, next_feature_summary_dim: null}
probe:
  candidate_window: 100
  budget_per_episode: 20
  safety: {rule: block_interact_facing_visible_goal_v1}
  threshold: {source: calibration, decision_null_quantile: 0.95, information_quantile: 0.80}
  belief_probability_floor: 1.0e-8
stages:
  prefit: {env_steps: 1000000, learning_rate: 0.00025, batch_size: 100000, loss_weights: {response: 1.0, prototype_value: 1.0, transition_response: 1.0, reward: 1.0, next_feature: 1.0}}
  training_calibration: {episodes: 500}
  adaptation: {env_steps: 10000000, critic_learning_rate: 0.0001, actor_learning_rate: 0.00025, auxiliary_learning_rate: 0.00025, ppo_clip: 0.2, gae_lambda: 0.95, gamma: 0.99, entropy_coefficient: 0.01, value_coefficient: 0.5, gradient_clip_norm: 0.25, update_epochs: 4, unroll_length: 400, num_minibatches: 50, learning_rate_warmup_fraction: 0.05, metrics_interval_env_steps: 100000}
  deployment_calibration: {episodes: 500}
  evaluation: {schedule: external_standard_matrix, episodes_per_pairing: 500}
output_root: ../../../results/path_c_family_pool_formal_standard/test_time_wide
