schema_version: path_c_standard_training_v1
run_kind: smoke
scientific_readout_allowed: false
seed: 1001
device: cuda
environment_config: ocv2_test_time_simple_standard.yaml
output_dir: ../../../results/path_c_standard_smoke/seed_default
model:
  observation_shape: [5, 5, 39]
  n_heads: 3
  visual_embedding_dim: 64
  encoder_dim: 64
  recurrent_dim: 64
  conv_channels: [16, 16, 8]
  prior_scale: 0.1
  prior_seed: 31
# The disagreement statistic is non-negative, so the threshold must stay
# strictly positive: at zero every step would probe and greedy would never act.
probe:
  enabled: true
  disagreement_threshold: 0.02
  return_floor: null
  disagreement_stat: variance
training:
  total_environment_steps: 1600
  self_play_environment_steps: 800
  path_c_environment_steps: 800
  batch_size_envs: 2
  partner_pool_snapshot_steps: [800]
  ego_initialization: self_play_final
  replay_capacity_episodes: 8
  minibatch_episodes: 2
  learning_starts_episodes: 2
  updates_per_vector_step: 1
  target_update_environment_steps: 400
  # One row per complete 400-step, two-environment smoke phase.
  metrics_interval_environment_steps: 800
  gamma: 0.99
  learning_rate: 0.00025
  gradient_clip_norm: 10.0
  epsilon_start: 0.2
  epsilon_end: 0.0
  epsilon_decay_environment_steps: 800
  bootstrap_p: 0.5
