schema_version: path_c_adaptation_v1
run_kind: diagnostic
scientific_readout_allowed: false
training_mode: joint
condition_id: finite_prototype_two_action_surrogate
seed: 101
device: cuda
environment_config: ocv2_test_time_simple_standard.yaml
output_dir: ../../../results/path_c_adaptation_simple_two_action_surrogate_v1/seed_101
backbone_checkpoint: ../../../results/path_c_backbone_simple/seed_101/backbone_final.pt
partner_pool_admission_report: ../../../results/path_c_pool_admission_diverse_simple/seed_101_102/pool_admission_report.json
response_initialization_checkpoint: ../../../results/path_c_auxiliary_prefit_simple_v1/seed_101/response_prefit.pt
probe_calibration_summary: ../../../results/path_c_surrogate_calibration_simple_v1/seed_101/summary.json
probe_calibration_summary_sha256: pending
probe_calibration_quantile: 0.80
initialization: backbone
evidence:
  partner_action_channel: false
model:
  n_critic_heads: 5
probe:
  # 该控制器只是在有限伙伴原型上计算两步动作代理量，不能进入正式科学读数。
  controller: finite_prototype_two_action_surrogate
  enabled: true
  response_model_mode: partner_conditioned
  # 通用回应信息阈值只供基线使用，不参与本控制器。
  response_disagreement_threshold: 1.0
  # 该值只能从上述 500 局无探查校准记录读取。
  surrogate_score_threshold: null
  max_probe_task_cost: 1.0
  response_route: use_registered_response
  advantage_disagreement_threshold: 0.02 # 旧探针消融数字槽。
  max_probe_regret: 1.0 # 数字槽，运行授权前冻结。
  probe_budget_per_episode: 20 # 数字槽，运行授权前冻结。
  probe_window_environment_steps: 100 # 数字槽，运行授权前冻结。
  response_ensemble_size: 2 # 与两个已准入伙伴假设一一对应。
  response_hidden_dim: 64
  partner_value_hidden_dim: 64
  belief_probability_floor: 1.0e-6
  bootstrap_seed: 51
  critic_bootstrap_p: 0.5 # 数字槽，运行授权前冻结。
training:
  total_environment_steps: 10000000
  shaping_horizon_environment_steps: 5000000
  stop_if_no_delivery_by_environment_steps: 5000000
  batch_size_envs: 250
  rollout_steps: 400
  metrics_interval_environment_steps: 100000
  target_update_environment_steps: 100000
  actor_update_epochs: 4
  trunk_learning_rate: 0.0001 # 数字槽，运行授权前冻结。
  actor_learning_rate: 0.00025 # 数字槽，运行授权前冻结。
  response_learning_rate: 0.00025 # 数字槽，运行授权前冻结。
  entropy_coefficient: 0.01
  ppo_clip: 0.2
  gamma: 0.99
  gradient_clip_norm: 0.25
