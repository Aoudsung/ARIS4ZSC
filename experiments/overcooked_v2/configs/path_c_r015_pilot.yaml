schema_version: path_c_r015_pilot_protocol_v1
status: static_registered_not_frozen
scientific_readout_allowed: false
experiment_id: R015

# 试点只核查接线并报告描述性离散程度，永不进入正式统计。
data_role: wiring_only_pilot_excluded_from_formal_statistics
environment:
  layout: test_time_simple
  max_steps: 400
  ego_agent_id: agent_1
  ego_role: cook
  partner_agent_id: agent_0
  partner_role: signaler
  round_sampling_contract: iid_round_vectors_ego_cook_seat_with_prefrozen_replacements_v4

sampling:
  partner_prototypes: 4
  paired_blocks_per_prototype: 20
  total_paired_blocks: 80
  episode_seed_namespace: r015_pilot_episode_20260715_v1
  root_seed: 15071502
  design_episode_namespace_forbidden: r015_design_episode_20260718_v2
  admission_evaluation_seed_root_forbidden: 8115
  formal_episode_namespace_forbidden: r015_formal_episode_v4
  require_realized_seed_sets_pairwise_disjoint: true

frozen_inputs:
  preregistration: path_c_r015_preregistration.yaml
  design_selection_report: pending_design_run
  signed_freeze_manifest: pending_type_b_signature
  support_registration: path_c_r015_partner_support_simple.yaml

wiring_checks:
  information_isolation: required
  filter_normalization_and_repeat_stability: required
  response_use_pairing: required
  random_key_naming: required
  zero_probe_interpretability: required
  artifact_counts_read_back: required
  lockstep_structural_zero: required
  shared_firing_indicator: required
  firing_count_input_isolation: required

outputs:
  report_schema: path_c_r015_pilot_wiring_report_v2
  report_path: pending_pilot_run
  required_header:
    scientific_readout_allowed: false
    pilot_data: true
    formal_interval_includes_pilot: false
    scientific_effect_used_for_round_budget: false
    empirical_variance_used_for_round_budget: false
  descriptive_paired_difference_spread: required_without_effect_decision
  planning_real_environment_transitions_per_block: required
  planning_branch_head_particle_transitions_per_block: required
  planning_paired_suffix_batched_lane_time_steps_per_block: required
  planning_compiled_batch_calls_per_block: required
  planning_active_batch_sizes_per_block: required
  planning_wall_seconds_per_block: required
  planning_real_transition_throughput_per_block: required
  zero_probe_interpretability_counts:
    - candidate_evaluation_count
    - safety_rejection_count
    - nonpositive_score_count
    - window_expiration_count

pass_rule:
  completed_blocks_per_prototype_must_equal: 20
  all_nine_wiring_checks_must_be_true: true
  any_failure_action: stop_chain_preserve_artifacts_return_to_type_b

execution_boundary:
  gpu_hour_estimate: 2.5
  current_execution_authorized: false
  gpu_hour_estimate_is_not_a_stop_limit: true
  formal_audit_included: false
