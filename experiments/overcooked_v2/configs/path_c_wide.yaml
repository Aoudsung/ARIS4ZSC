version: 4

environment:
  layout: test_time_wide
  agent_view_size: 2
  indicate_successful_delivery: true
  episode_steps: 400

model:
  hidden_dim: 128
  action_embedding_dim: 16
  slot_count: 8
  response_count: 16
  action_count: 6
  prior_scale: 0.01
  log_standard_deviation_minimum: -5.0
  log_standard_deviation_maximum: 2.0
  uncertainty_penalty: 1.0

training:
  update_epochs: 4
  bellman_learning_rate: 0.0001
  outcome_learning_rate: 0.00025
  gradient_clip_norm: 0.25
  gamma: 0.99
  responsibility_temperature: 1.0
  bootstrap_probability: 0.8
  retrace_lambda: 0.9
  importance_ratio_clip: 1.0
  behavior_exploration_mix: 0.25
  behavior_exploration_temperature: 0.5
  behavior_uniform_floor: 0.02
  polyak_coefficient: 0.005
  codebook_decay: 0.99
  code_replacement_rollouts: 10

kl:
  target_per_step: 0.02
  initial_temperature: 1.0
  bisection_iterations: 24
  minimum_temperature: 0.05
  maximum_temperature: 20.0

evaluation:
  deployment_modes:
    - posterior_use
    - prior_only
    - reference_only
    - generic_response_information
  episodes_per_pairing: 500
  response_policy_tv_minimum: 0.001

upstream:
  total_timesteps: 30000000
  reward_shaping_horizon: 15000000
  checkpoint_progress: [0.0, 0.5, 1.0]
