model:
  encoder_dim: null
  gru_hidden_dim: null
  response_hidden_dim: 128
  value_hidden_dim: 128
  transition_hidden_dim: 128
  next_feature_summary_dim: null

probe:
  candidate_window: 100
  budget_per_episode: 20
  safety:
    rule: block_interact_facing_visible_goal_v1
  threshold:
    source: calibration
    decision_null_quantile: 0.95
    information_quantile: 0.80
  belief_probability_floor: 1.0e-8

stages:
  prefit:
    env_steps: 204800
    learning_rate: 0.00025
    batch_size: 12800
    loss_weights:
      response: 1.0
      prototype_value: 1.0
      transition_response: 1.0
      reward: 1.0
      next_feature: 1.0
  calibration:
    episodes: 128
  adaptation:
    env_steps: 1024000
    critic_learning_rate: 0.0001
    actor_learning_rate: 0.00025
    auxiliary_learning_rate: 0.00025
    ppo_clip: 0.2
    gae_lambda: 0.95
    gamma: 0.99
    entropy_coefficient: 0.01
    value_coefficient: 0.5
    gradient_clip_norm: 0.25
    update_epochs: 4
    unroll_length: 400
    num_minibatches: 32
    learning_rate_warmup_fraction: 0.05
    metrics_interval_env_steps: 102400
  evaluation:
    schedule: development_pool_bidirectional
    episodes_per_pairing: 64

seeds:
  model_seed: 10101
  environment_seed: 10102
  evaluation_seed: 10103

