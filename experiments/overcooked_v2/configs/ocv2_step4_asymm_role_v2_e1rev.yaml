layout: asymm_advantages
env:
  max_steps: 400
  observation_type: default
  negative_rewards: true
  sample_recipe_on_delivery: true
  random_reset: false
  random_agent_positions: false
  force_path_planning: true
options:
  max_option_steps: 16
  strict_preconditions: true
  dynamic_budget: true
layouts:
  filter:
    min_options: 6
graph:
  ce_path: outputs/asymm_ce_role_v2_e1_s27fixed_retry2/ce_refined.npy
  replay_path: outputs/asymm_ce_role_v2_e1_s27fixed_retry2/replay.npz
  preflight_path: results_phase2/E1_preflight.json
  relevance_semantics: legacy_id_pair
  ce_eta: 0.02
  max_factors: 16
  full_max_factors: 16
  selection: coverage_constrained_ce
  required_option_kind_coverage:
    pick_plate:
      min_factors: 1
    plate_soup:
      min_factors: 1
    serve_soup:
      min_factors: 1
    clear_interaction_cell:
      min_factors: 1
  diversity:
    max_factors_per_option_kind_pair: 3
    max_factors_per_option_id: 4
  overcomplete_extra_factors: 8
  local_return_horizon_options: 3
  modes:
    bottleneck: 3
    resource: 2
    handoff: 3
    serving: 2
    pot_allocation: 2
    recipe_indicator: 2
    generic_option_pair: 3
  graph_path: outputs/asymm_ce_role_v2_e1_s27fixed_retry2/graph.json
  ce_min_weight: 5.0
diagnostics:
  proxy_episodes: 10
benchmark_variant: role_conditioned_v2_candidate
benchmark_standard_library: false
benchmark_requires_partner_differentiation_certificate: true
training:
  partner_set: role_conditioned_v2
  train_partners:
  - ingredient-near-yield
  - ingredient-far-yield
  - server-left-claim
  - server-right-claim
  - bottleneck-yield-terminal-yield
  - bottleneck-push-terminal-claim
  heldout_partners:
  - heldout-handoff-alternate-yield
  - heldout-resource-server-claim
  partner_groups:
    ingredient-near-yield: terminal_yield
    ingredient-far-yield: terminal_yield
    bottleneck-yield-terminal-yield: terminal_yield
    server-left-claim: terminal_claim
    server-right-claim: terminal_claim
    bottleneck-push-terminal-claim: terminal_claim
  partner_sampling: {}
  sparse_credit: contrib_team
  contrib_team:
    contrib_scale: 1.0
  role_contrib_team:
    ego_terminal_penalty_under_claim: 0.3
  terminal_progress_shaping:
    enabled: true
    ego_plate_pick_bonus: 0.5
    ego_plate_soup_bonus: 1.5
    ego_serve_bonus: 0.0
    max_bonus_per_step: 1.5
  role_exploration:
    enabled: false
    yield:
      bias_start: 0.9
      bias_end: 0.35
      anneal_updates: 2500
      preferred_kinds:
      - serve_soup
      - plate_soup
      - pick_plate
    claim:
      bias_start: 0.9
      bias_end: 0.35
      anneal_updates: 2500
      preferred_kinds:
      - deliver_ingredient_to_pot
      - fetch_ingredient
      - clear_interaction_cell
      - wait_at_bottleneck
      - drop_item_to_counter
  terminal_exploration:
    enabled: true
    bias_start: 0.9
    bias_end: 0.35
    anneal_updates: 2500
    preferred_kinds:
    - serve_soup
    - plate_soup
    - pick_plate
  terminal_replay_seed:
    enabled: false
  role_replay_seed:
    enabled: false
    chains:
    - name: ego_terminal_against_yield
      partner: ingredient-near-yield
      target_actor: ego
      target_deliveries: 32
      ego_priority_kinds:
      - serve_soup
      - plate_soup
      - pick_plate
      - deliver_ingredient_to_pot
      - fetch_ingredient
      - clear_interaction_cell
      - wait_at_bottleneck
    - name: support_partner_terminal_claim
      partner: server-left-claim
      target_actor: partner
      target_deliveries: 32
      ego_priority_kinds:
      - deliver_ingredient_to_pot
      - fetch_ingredient
      - clear_interaction_cell
      - wait_at_bottleneck
      - drop_item_to_counter
    seed_updates: 600
    seed_batch_size: 8
  require_ego_delivery_selection: true
  require_preflight_accepted: true
  total_updates: 5000
  updates_per_transition: 8
  batch_size: 8
  warmup_transitions: 8
  replay_size: 5000
  gamma: 0.99
  cost_coef: 0.02
  cost_per_step: 1.0
  shaped_reward_coef: 1.0
  learning_rate: 0.0003
  td_loss: huber
  huber_delta: 1.0
  double_q: true
  advantage_norm: none
  value_bound:
    enabled: true
    apply_to_all_methods: true
    vmax: 30.0
    base_bound: 15.0
    adv_bound: 15.0
    adv_unit: 1.0
    reward_scale: 1.0
  checkpoint_every: 500
  select_best_by: greedy
  checkpoint_eval_episodes: 5
  hidden_dim: 64
  obs_encoder: auto
  num_partners: 8
  evidence_window: 4
  target_update_interval: 50
  grad_clip_norm: 5.0
  epsilon_start: 0.5
  epsilon_end: 0.1
  max_episode_options: 20
  log_interval: 100
  oracle_role_conditioned_ablation: false
evidence:
  partner_option_inference:
    mode: inferred
    support_mix: 0.05
    allow_heuristic: true
    temperature: 1.0
    source_policy: behavior_observable_only
