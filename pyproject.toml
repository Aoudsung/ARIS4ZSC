[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aris4zsc"
version = "0.4.0"
description = "Unified response-decision Bayesian zero-shot coordination"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy>=1.24,<2",
  "pyyaml>=6.0",
  "pyarrow>=14.0",
  "jax==0.4.38",
  "jaxlib==0.4.38",
  "jaxmarl @ git+https://github.com/overcookedv2/experiments.git@5ce1707cf31c1c115e6f6ba96db7bc9cc80a850e#subdirectory=JaxMARL",
  "overcooked_v2_experiments @ git+https://github.com/overcookedv2/experiments.git@5ce1707cf31c1c115e6f6ba96db7bc9cc80a850e#subdirectory=experiments",
  "overcooked-ai==1.1.0",
  "chex>=0.1.86",
  "flax==0.10.3",
  "optax==0.2.5",
  "orbax-checkpoint>=0.5",
  "distrax>=0.1",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "wandb>=0.17",
  "pytest>=8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src.delta_zsc*", "src.path_c*", "experiments.overcooked_v2*"]
namespaces = true
