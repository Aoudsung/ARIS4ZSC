[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aris4zsc"
version = "0.3.0"
description = "DELTA-ZSC V6 end-to-end Bayes coordination experiments"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy>=1.24,<2",
  "pyyaml>=6.0",
  "pyarrow>=14.0",
  "jax==0.4.38",
  "jaxlib==0.4.38",
  "jaxmarl @ git+https://github.com/overcookedv2/experiments.git@5ce1707cf31c1c115e6f6ba96db7bc9cc80a850e#subdirectory=JaxMARL",
  "overcooked_v2_experiments @ git+https://github.com/overcookedv2/experiments.git@5ce1707cf31c1c115e6f6ba96db7bc9cc80a850e#subdirectory=experiments",
  # The fixed Official PPO entrypoint imports its bundled BC adapter even for
  # SP/SA/OP/FCP, and that adapter imports the stable Overcooked-AI package.
  "overcooked-ai==1.1.0",
  "chex>=0.1.86",
  "flax==0.10.3",
  "optax==0.2.5",
  "orbax-checkpoint>=0.5",
  "distrax>=0.1",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "wandb>=0.17",
  "pytest>=8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src.path_c*", "experiments.overcooked_v2*"]
namespaces = true
