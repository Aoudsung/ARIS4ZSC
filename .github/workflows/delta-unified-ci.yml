name: delta-unified-ci

on:
  push:
    branches: ["agent/delta-zsc-unified"]
  pull_request:
  workflow_dispatch:
    inputs:
      config:
        description: "Unified formal configuration"
        required: true
        default: "experiments/overcooked_v2/configs/delta_unified_simple_formal.yaml"
        type: string
      partner_manifest:
        description: "Absolute partner manifest on the self-hosted runner"
        required: true
        type: string
      output_root:
        description: "Absolute writable artifact root"
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install pinned project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          git clone --quiet https://github.com/overcookedv2/experiments.git /tmp/overcookedv2-official
          git -C /tmp/overcookedv2-official checkout --quiet 5ce1707cf31c1c115e6f6ba96db7bc9cc80a850e
          python -m pip install --no-deps \
            -e /tmp/overcookedv2-official/JaxMARL \
            -e /tmp/overcookedv2-official/experiments
          python -m pip check
      - name: Compile unified implementation
        run: python -m compileall -q src/delta_zsc experiments/overcooked_v2
      - name: Run unified tests
        run: pytest -q experiments/overcooked_v2/tests/test_unified_delta_*.py
      - name: Smoke test unified CLI
        run: |
          python -m experiments.overcooked_v2.delta_zsc --help
          python -m experiments.overcooked_v2.delta_zsc train --help
          python -m experiments.overcooked_v2.delta_zsc evaluate --help
          python -m experiments.overcooked_v2.delta_zsc calibrate --help
          python -m experiments.overcooked_v2.delta_zsc evaluate-causal-belief --help
          python -m experiments.overcooked_v2.delta_zsc summarize --help
      - name: Enforce one-principle active method
        run: |
          ! grep -R -n -E 'pair_comparator|separation_margin|context_dropout|capability_consistency_weight|posterior_decision_weight|decision_policy_weight|gradient_routing|decision_regret|partner_generator' src/delta_zsc experiments/overcooked_v2/unified_*_app.py
      - name: Reject committed credentials
        run: |
          ! git grep -n -E 'password[[:space:]]*[:=][[:space:]]*[^$<{[:space:]]|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|gh[opusr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}'

  cuda-preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 120
    env:
      JAX_PLATFORMS: cuda
      JAX_DEFAULT_MATMUL_PRECISION: highest
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      DEPI_REQUIRE_CUDA: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Register one idle physical GPU
        shell: bash
        run: |
          selected=""
          while IFS=',' read -r index uuid name total used utilization ecc; do
            index="$(xargs <<<"${index}")"
            uuid="$(xargs <<<"${uuid}")"
            name="$(xargs <<<"${name}")"
            total="$(xargs <<<"${total}")"
            used="$(xargs <<<"${used}")"
            utilization="$(xargs <<<"${utilization}")"
            ecc="$(xargs <<<"${ecc}")"
            if [[ "${used}" =~ ^[0-9]+$ && "${utilization}" =~ ^[0-9]+$ && "${ecc}" == "0" ]] \
              && (( used <= 1024 && utilization <= 10 )); then
              selected="${index}"
              {
                echo "CUDA_VISIBLE_DEVICES=${index}"
                echo "DEPI_PHYSICAL_GPU_INDEX=${index}"
                echo "DEPI_PHYSICAL_GPU_UUID=${uuid}"
                echo "DEPI_GPU_NAME=${name}"
                echo "DEPI_GPU_TOTAL_MEMORY_MIB=${total}"
                echo "DEPI_GPU_START_MEMORY_USED_MIB=${used}"
                echo "DEPI_GPU_START_UTILIZATION_PERCENT=${utilization}"
                echo "DEPI_GPU_VOLATILE_UNCORRECTABLE_ECC=${ecc}"
              } >> "${GITHUB_ENV}"
              break
            fi
          done < <(nvidia-smi \
            --query-gpu=index,uuid,name,memory.total,memory.used,utilization.gpu,ecc.errors.uncorrected.volatile.total \
            --format=csv,noheader,nounits)
          test -n "${selected}"
      - name: Run one-update unified CUDA preflight
        run: |
          source .venv/bin/activate
          python -m experiments.overcooked_v2.delta_zsc train \
            --config "${{ inputs.config }}" \
            --partner-manifest "${{ inputs.partner_manifest }}" \
            --variant joint \
            --seed-index -1 \
            --run-kind mechanical \
            --require-cuda \
            --output "${{ inputs.output_root }}/delta-unified-cuda-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: delta-unified-cuda-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ inputs.output_root }}/delta-unified-cuda-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
