name: delta-unified-ci

on:
  push:
    branches:
      - main
      - agent/delta-zsc-v5
      - agent/delta-zsc-unified
      - zsc_v8
  pull_request:
  workflow_dispatch:
    inputs:
      run_cuda_preflight:
        description: "Run one real CUDA mechanical update on a self-hosted runner"
        required: true
        default: false
        type: boolean
      config:
        description: "Mechanical unified DELTA configuration"
        required: true
        default: "experiments/overcooked_v2/configs/delta_unified_simple_mechanical.yaml"
        type: string
      partner_manifest:
        description: "Absolute lineage-bound partner manifest on the self-hosted runner"
        required: false
        type: string
      semantic_initializer:
        description: "Absolute DELTA v4 semantic-initializer directory or NPZ path"
        required: false
        type: string
      output_root:
        description: "Absolute writable output root on the self-hosted runner"
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install pinned project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check
      - name: Compile active implementation
        run: |
          python -m compileall -q src/delta_zsc experiments/overcooked_v2
      - name: Run every DELTA test in isolated JAX processes
        run: |
          python validation/run_all_isolated_tests.py
      - name: Validate all registered configurations
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.delta_zsc.config import load_config
          for path in sorted(Path("experiments/overcooked_v2/configs").glob("delta_unified_*.yaml")):
              run_kind = path.stem.rsplit("_", 1)[-1]
              if run_kind == "collector":
                  run_kind = "development"
              load_config(path, run_kind=run_kind)
              print(path)
          PY
      - name: Smoke test unified CLI
        run: |
          python -m experiments.overcooked_v2.delta_zsc --help
          for command in \
            build-partner-manifest validate-partner-manifest train cuda-preflight \
            build-policy-manifest evaluate summarize-evaluations summarize-population-matrices \
            build-semantic-initializer posterior-diagnostics belief-intervention run-development-matrix \
            evaluate-development-matrix summarize-development-matrix \
            train-baseline train-official-parent run-upstream resource-report formal-claim; do
            python -m experiments.overcooked_v2.delta_zsc "${command}" --help
          done
      - name: Enforce one active scientific namespace
        run: |
          test ! -d src/path_c
          test ! -f src/delta_zsc/transition.py
          ! grep -R -n -E 'pair_comparator|separation_margin|context_dropout|capability_consistency_weight|posterior_decision_weight|decision_policy_weight|gradient_routing|decision_regret|response_cross_log_likelihood' src/delta_zsc
          ! grep -R -n -E 'src\.path_c\.(model|training)' \
            experiments/overcooked_v2/training_app.py \
            experiments/overcooked_v2/evaluation_app.py \
            experiments/overcooked_v2/calibration_app.py \
            experiments/overcooked_v2/intervention_app.py \
            experiments/overcooked_v2/development_matrix_app.py \
            experiments/overcooked_v2/formal_claim_app.py \
            experiments/overcooked_v2/resource_report_app.py \
            experiments/overcooked_v2/delta_manifest_app.py
      - name: Reject committed credentials
        run: |
          ! git grep -n -E 'BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|gh[opusr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}'

  cuda-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.run_cuda_preflight
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 120
    env:
      JAX_PLATFORMS: cuda
      JAX_DEFAULT_MATMUL_PRECISION: highest
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Validate dispatch inputs
        shell: bash
        run: |
          test -n "${{ inputs.partner_manifest }}"
          test -n "${{ inputs.output_root }}"
          test -n "${{ inputs.semantic_initializer }}"
          test -f "${{ inputs.partner_manifest }}"
          test -e "${{ inputs.semantic_initializer }}"
      - name: Register one idle physical GPU
        shell: bash
        run: |
          selected=""
          while IFS=',' read -r index uuid name total used utilization ecc; do
            index="$(xargs <<<"${index}")"
            uuid="$(xargs <<<"${uuid}")"
            name="$(xargs <<<"${name}")"
            total="$(xargs <<<"${total}")"
            used="$(xargs <<<"${used}")"
            utilization="$(xargs <<<"${utilization}")"
            ecc="$(xargs <<<"${ecc}")"
            if [[ "${used}" =~ ^[0-9]+$ && "${utilization}" =~ ^[0-9]+$ && "${ecc}" == "0" ]] \
              && (( used <= 1024 && utilization <= 10 )); then
              selected="${index}"
              {
                echo "CUDA_VISIBLE_DEVICES=${index}"
                echo "DELTA_PHYSICAL_GPU_INDEX=${index}"
                echo "DELTA_PHYSICAL_GPU_UUID=${uuid}"
                echo "DELTA_GPU_NAME=${name}"
                echo "DELTA_GPU_TOTAL_MEMORY_MIB=${total}"
              } >> "${GITHUB_ENV}"
              break
            fi
          done < <(nvidia-smi \
            --query-gpu=index,uuid,name,memory.total,memory.used,utilization.gpu,ecc.errors.uncorrected.volatile.total \
            --format=csv,noheader,nounits)
          test -n "${selected}"
      - name: Install project in isolated Python 3.10 environment
        shell: bash
        run: |
          python3.10 -m venv .venv-delta-ci
          source .venv-delta-ci/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run one-update CUDA acceptance path
        shell: bash
        run: |
          source .venv-delta-ci/bin/activate
          python -m experiments.overcooked_v2.delta_zsc cuda-preflight \
            --config "${{ inputs.config }}" \
            --run-kind mechanical \
            --partner-manifest "${{ inputs.partner_manifest }}" \
            --ego-run-id delta-cuda-preflight \
            --seed-index -1 \
            --semantic-initializer "${{ inputs.semantic_initializer }}" \
            --output "${{ inputs.output_root }}/delta-cuda-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: delta-cuda-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ inputs.output_root }}/delta-cuda-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
