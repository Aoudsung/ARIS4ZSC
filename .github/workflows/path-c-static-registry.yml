name: Path C static registry

on:
  pull_request:
    paths:
      - "experiments/overcooked_v2/**"
      - "src/aris_bellman/**"
      - "PROJECT_DASHBOARD.md"
      - "idea-stage/refine-logs/PATH_C_*.md"
      - ".github/workflows/path-c-static-registry.yml"
  push:
    paths:
      - "experiments/overcooked_v2/**"
      - "src/aris_bellman/**"
      - "PROJECT_DASHBOARD.md"
      - "idea-stage/refine-logs/PATH_C_*.md"
      - ".github/workflows/path-c-static-registry.yml"

jobs:
  registry-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check registry and documentation traceability
        run: python experiments/overcooked_v2/scripts/check_path_c_module_registry.py
