name: depi-ci

on:
  push:
    branches: ["agent/delta-zsc-v5"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install pinned project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          git clone --quiet https://github.com/overcookedv2/experiments.git /tmp/overcookedv2-official
          git -C /tmp/overcookedv2-official checkout --quiet 5ce1707cf31c1c115e6f6ba96db7bc9cc80a850e
          python -m pip install --no-deps \
            -e /tmp/overcookedv2-official/JaxMARL \
            -e /tmp/overcookedv2-official/experiments
          python -m pip check
      - name: Compile active implementation
        run: python -m compileall -q src/path_c experiments/overcooked_v2
      - name: Run DEPI tests
        run: pytest -q experiments/overcooked_v2/tests/test_depi_*.py
      - name: Smoke test command entry
        run: |
          python -m experiments.overcooked_v2.path_c --help
          python -m experiments.overcooked_v2.path_c train --help
          python -m experiments.overcooked_v2.path_c calibrate-posterior --help
          python -m experiments.overcooked_v2.path_c evaluate-identifiability --help
          python -m experiments.overcooked_v2.path_c evaluate-recoverable-value --help
          python -m experiments.overcooked_v2.path_c run-development-matrix --help
          python -m experiments.overcooked_v2.path_c audit-signals --help
          python -m experiments.overcooked_v2.path_c evaluate-official --help
          python -m experiments.overcooked_v2.path_c evaluate-common --help
      - name: Reject legacy semantics in active source
        run: |
          ! grep -R -n -E 'slot_log_belief|TwinDuelingQ|CodebookState|next_q_use_targets|next_q_mask_targets|episode_responsibility_evidence|bellman_control_values|target_response_signatures' src/path_c experiments/overcooked_v2 --exclude-dir=tests --exclude-dir=__pycache__
      - name: Reject retired control paths in active source
        run: |
          ! grep -R -n -E 'CurriculumPhase|qualified_base_params|deployment_tier|base_logits|residual_logits|conditional_enabled|regret_enabled|GeneratorAdmission|TargetPolicyEpoch|GaussianMixtureBelief|previous_reward|hard_adaptation_gate|owner_sp_source_fallback' src/path_c experiments/overcooked_v2 --exclude-dir=tests --exclude-dir=__pycache__
      - name: Reject superseded method identity
        run: |
          ! grep -R -n -E 'V6|GaussianBelief|posterior_particles|decision_regret_shaping' src/path_c experiments/overcooked_v2 README.md docs --exclude-dir=legacy --exclude-dir=__pycache__ --exclude=EVIDENCE_LEDGER.md --exclude=DECISION_LOG.md
      - name: Reject committed credentials
        run: |
          ! git ls-files | grep -E '(^|/)SSH_Document\.md$'
          ! git grep -n -E 'SSH[[:space:]]+Password:|password[[:space:]]*[:=][[:space:]]*[^$<{[:space:]]|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|gh[opusr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}'
