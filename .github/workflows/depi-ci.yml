name: depi-ci

on:
  push:
    branches: ["agent/delta-zsc-v5"]
  pull_request:
  workflow_dispatch:
    inputs:
      config:
        description: "Tracked formal DEPI config"
        required: true
        default: "experiments/overcooked_v2/configs/depi_simple_formal.yaml"
        type: string
      partner_manifest:
        description: "Absolute formal partner manifest path on the self-hosted runner"
        required: true
        type: string
      pair_comparator:
        description: "Absolute frozen comparator artifact on the self-hosted runner"
        required: true
        type: string
      comparator_reference_ego_checkpoint:
        description: "Absolute comparator reference-ego checkpoint"
        required: true
        type: string
      output_root:
        description: "Absolute writable run-artifact root on the self-hosted runner"
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install pinned project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          git clone --quiet https://github.com/overcookedv2/experiments.git /tmp/overcookedv2-official
          git -C /tmp/overcookedv2-official checkout --quiet 5ce1707cf31c1c115e6f6ba96db7bc9cc80a850e
          python -m pip install --no-deps \
            -e /tmp/overcookedv2-official/JaxMARL \
            -e /tmp/overcookedv2-official/experiments
          python -m pip check
      - name: Compile active implementation
        run: python -m compileall -q src/path_c experiments/overcooked_v2
      - name: Run DEPI tests
        run: pytest -q experiments/overcooked_v2/tests/test_depi_*.py
      - name: Smoke test command entry
        run: |
          python -m experiments.overcooked_v2.path_c --help
          python -m experiments.overcooked_v2.path_c train --help
          python -m experiments.overcooked_v2.path_c scientific-dry-run --help
          python -m experiments.overcooked_v2.path_c calibrate-posterior --help
          python -m experiments.overcooked_v2.path_c evaluate-identifiability --help
          python -m experiments.overcooked_v2.path_c evaluate-recoverable-value --help
          python -m experiments.overcooked_v2.path_c run-development-matrix --help
          python -m experiments.overcooked_v2.path_c collect-pair-comparator-source --help
          python -m experiments.overcooked_v2.path_c fit-pair-comparator --help
          python -m experiments.overcooked_v2.path_c evaluate-development-matrix --help
          python -m experiments.overcooked_v2.path_c summarize-development-matrix --help
          python -m experiments.overcooked_v2.path_c build-decision-coverage-source --help
          python -m experiments.overcooked_v2.path_c summarize-decision-coverage --help
          python -m experiments.overcooked_v2.path_c run-protocol-sensitivity-matrix --help
          python -m experiments.overcooked_v2.path_c build-contemporary-proxy-manifest --help
          python -m experiments.overcooked_v2.path_c evaluate-common-proxies --help
          python -m experiments.overcooked_v2.path_c audit-signals --help
          python -m experiments.overcooked_v2.path_c evaluate-official --help
          python -m experiments.overcooked_v2.path_c evaluate-common --help
      - name: Reject legacy semantics in active source
        run: |
          ! grep -R -n -E 'slot_log_belief|TwinDuelingQ|CodebookState|next_q_use_targets|next_q_mask_targets|episode_responsibility_evidence|bellman_control_values|target_response_signatures' src/path_c experiments/overcooked_v2 --exclude-dir=tests --exclude-dir=__pycache__
      - name: Reject retired control paths in active source
        run: |
          ! grep -R -n -E 'CurriculumPhase|qualified_base_params|deployment_tier|base_logits|residual_logits|conditional_enabled|regret_enabled|GeneratorAdmission|TargetPolicyEpoch|GaussianMixtureBelief|previous_reward|hard_adaptation_gate|owner_sp_source_fallback' src/path_c experiments/overcooked_v2 --exclude-dir=tests --exclude-dir=__pycache__
      - name: Reject superseded method identity
        run: |
          ! grep -R -n -E 'V6|GaussianBelief|posterior_particles|decision_regret_shaping' src/path_c experiments/overcooked_v2 README.md docs --exclude-dir=legacy --exclude-dir=__pycache__ --exclude=EVIDENCE_LEDGER.md --exclude=DECISION_LOG.md
      - name: Reject committed credentials
        run: |
          ! git ls-files | grep -E '(^|/)SSH_Document\.md$'
          ! git grep -n -E 'SSH[[:space:]]+Password:|password[[:space:]]*[:=][[:space:]]*[^$<{[:space:]]|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|gh[opusr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}'

  cuda-preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 90
    env:
      JAX_PLATFORMS: cuda
      JAX_DEFAULT_MATMUL_PRECISION: highest
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      DEPI_REQUIRE_CUDA: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Register one idle physical GPU
        shell: bash
        run: |
          selected=""
          while IFS=',' read -r index uuid name total used utilization ecc; do
            index="$(xargs <<<"${index}")"
            uuid="$(xargs <<<"${uuid}")"
            name="$(xargs <<<"${name}")"
            total="$(xargs <<<"${total}")"
            used="$(xargs <<<"${used}")"
            utilization="$(xargs <<<"${utilization}")"
            ecc="$(xargs <<<"${ecc}")"
            if [[ "${used}" =~ ^[0-9]+$ && "${utilization}" =~ ^[0-9]+$ && "${ecc}" == "0" ]] \
              && (( used <= 1024 && utilization <= 10 )); then
              selected="${index}"
              {
                echo "CUDA_VISIBLE_DEVICES=${index}"
                echo "DEPI_PHYSICAL_GPU_INDEX=${index}"
                echo "DEPI_PHYSICAL_GPU_UUID=${uuid}"
                echo "DEPI_GPU_NAME=${name}"
                echo "DEPI_GPU_TOTAL_MEMORY_MIB=${total}"
                echo "DEPI_GPU_START_MEMORY_USED_MIB=${used}"
                echo "DEPI_GPU_START_UTILIZATION_PERCENT=${utilization}"
                echo "DEPI_GPU_VOLATILE_UNCORRECTABLE_ECC=${ecc}"
              } >> "${GITHUB_ENV}"
              break
            fi
          done < <(nvidia-smi \
            --query-gpu=index,uuid,name,memory.total,memory.used,utilization.gpu,ecc.errors.uncorrected.volatile.total \
            --format=csv,noheader,nounits)
          test -n "${selected}"
      - name: Verify pinned runtime and compile
        run: |
          source .venv/bin/activate
          python -m compileall -q src/path_c experiments/overcooked_v2
          python -m pip check
      - name: Formal-shape single-update CUDA preflight
        run: |
          source .venv/bin/activate
          python -m experiments.overcooked_v2.path_c cuda-preflight \
            --config "${{ inputs.config }}" \
            --partner-manifest "${{ inputs.partner_manifest }}" \
            --pair-comparator "${{ inputs.pair_comparator }}" \
            --comparator-reference-ego-checkpoint "${{ inputs.comparator_reference_ego_checkpoint }}" \
            --output "${{ inputs.output_root }}/depi-cuda-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Upload CUDA acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: depi-cuda-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ inputs.output_root }}/depi-cuda-${{ github.run_id }}-${{ github.run_attempt }}/cuda_preflight_report.json
          if-no-files-found: error
